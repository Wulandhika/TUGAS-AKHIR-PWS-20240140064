<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather SaaS Cloud Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/85 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2 rounded-xl text-white">🌤️</div>
                <span class="font-bold text-lg text-white">Weather<span class="text-blue-400">SaaS</span></span>
            </div>
            <div id="userNavSection" class="hidden flex items-center gap-4 text-sm">
                <span id="userEmailDisplay" class="text-slate-400 text-xs"></span>
                <button onclick="logout()" class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-rose-500/20 transition">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8 space-y-8 flex-1 w-full">

        <!-- AUTH SECTION -->
        <div id="authSection" class="max-w-md mx-auto bg-slate-800/60 border border-slate-700/60 p-8 rounded-2xl shadow-xl backdrop-blur-sm">
            <div class="flex border-b border-slate-700 mb-6">
                <button onclick="switchTab('login')" id="tabLogin" class="flex-1 pb-3 text-sm font-bold text-blue-400 border-b-2 border-blue-500">Login</button>
                <button onclick="switchTab('register')" id="tabRegister" class="flex-1 pb-3 text-sm font-bold text-slate-400">Register</button>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Email</label>
                    <input type="email" id="authEmail" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                    <input type="password" id="authPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" id="authBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-blue-600/20">Login ke Akun</button>
            </form>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="hidden space-y-8">
            
            <!-- API KEY SECTION -->
            <section class="bg-slate-800/60 border border-slate-700/60 p-6 rounded-2xl shadow-lg backdrop-blur-sm">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h3 class="font-bold text-white text-base flex items-center gap-2"><span>🔑</span> API Key Aktif</h3>
                        <p class="text-sm text-slate-400">API Key tersimpan otomatis di browser dan langsung aktif digunakan.</p>
                    </div>
                    <button onclick="generateApiKey()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/20">⚡ Generate API Key Baru</button>
                </div>
                
                <div class="mt-4 p-3 bg-slate-900 border border-slate-700 rounded-xl flex items-center justify-between gap-3">
                    <span id="apiKeyDisplay" class="text-sm text-blue-400 font-mono tracking-wide truncate">Belum ada API Key. Silakan klik Generate.</span>
                    <button onclick="copyApiKey()" id="copyBtn" class="hidden shrink-0 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-700">Salin</button>
                </div>
            </section>

            <!-- WEATHER DATA SECTION -->
            <section class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-lg backdrop-blur-sm">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="font-bold text-white text-lg">📊 Weather Database Records (50 Kota)</h3>
                        <p class="text-xs text-slate-400">Endpoint: <code class="text-blue-400">/api/v1/weather</code></p>
                    </div>
                    <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-emerald-600/20">+ Tambah Data</button>
                </div>

                <div class="overflow-x-auto rounded-xl border border-slate-700 max-h-[500px]">
                    <table class="w-full text-left border-collapse relative">
                        <thead class="sticky top-0 bg-slate-900 text-slate-400 text-xs font-bold uppercase tracking-wider z-10">
                            <tr>
                                <th class="p-4 border-b border-slate-700">Kota</th>
                                <th class="p-4 border-b border-slate-700">Suhu</th>
                                <th class="p-4 border-b border-slate-700">Kelembapan</th>
                                <th class="p-4 border-b border-slate-700">Angin</th>
                                <th class="p-4 border-b border-slate-700">AQI</th>
                                <th class="p-4 border-b border-slate-700">Status</th>
                                <th class="p-4 border-b border-slate-700 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="weatherTableBody" class="text-sm divide-y divide-slate-700/50"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="weatherModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 id="modalTitle" class="text-lg font-bold text-white mb-4">Form Data Cuaca</h3>
            <form id="weatherForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="dataId">
                <div><label class="block text-xs font-semibold text-slate-400 mb-1">Kota</label><input type="text" id="city" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs font-semibold text-slate-400 mb-1">Suhu (°C)</label><input type="number" step="0.1" id="temperature" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></div>
                    <div><label class="block text-xs font-semibold text-slate-400 mb-1">Kelembapan (%)</label><input type="number" id="humidity" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs font-semibold text-slate-400 mb-1">Angin (km/h)</label><input type="number" step="0.1" id="wind_speed" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></div>
                    <div><label class="block text-xs font-semibold text-slate-400 mb-1">AQI</label><input type="number" id="air_quality" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></div>
                </div>
                <div><label class="block text-xs font-semibold text-slate-400 mb-1">Status</label><input type="text" id="status" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm">Batal</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script -->
    <script>
        // Gunakan Base URL backend secara eksplisit agar aman dari masalah port / CORS
        const API_BASE_URL = 'http://localhost:5000';

        let isLoginMode = true;
        let jwtToken = localStorage.getItem('saas_jwt') || '';
        let currentApiKey = localStorage.getItem('saas_api_key') || '';

        updateApiKeyDisplay();
        checkAuthState();

        function switchTab(mode) {
            isLoginMode = (mode === 'login');
            document.getElementById('tabLogin').className = isLoginMode ? 'flex-1 pb-3 text-sm font-bold text-blue-400 border-b-2 border-blue-500' : 'flex-1 pb-3 text-sm font-bold text-slate-400';
            document.getElementById('tabRegister').className = !isLoginMode ? 'flex-1 pb-3 text-sm font-bold text-blue-400 border-b-2 border-blue-500' : 'flex-1 pb-3 text-sm font-bold text-slate-400';
            document.getElementById('authBtn').innerText = isLoginMode ? 'Login ke Akun' : 'Daftar Akun Baru';
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const endpoint = isLoginMode ? `${API_BASE_URL}/api/auth/login` : `${API_BASE_URL}/api/auth/register`;

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await res.json();

                if (res.ok) {
                    if (isLoginMode) {
                        jwtToken = result.token || result.accessToken;
                        localStorage.setItem('saas_jwt', jwtToken);
                        alert('Login Berhasil!');
                        checkAuthState();
                    } else {
                        alert('Registrasi Berhasil! Silakan login.');
                        switchTab('login');
                    }
                } else {
                    alert('Gagal: ' + (result.error || result.message || 'Terjadi kesalahan pada database'));
                }
            } catch (err) {
                console.error(err);
                alert('Gagal terhubung ke server backend di ' + API_BASE_URL);
            }
        }

        function checkAuthState() {
            if (jwtToken) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('userNavSection').classList.remove('hidden');
                loadWeatherData();
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
                document.getElementById('userNavSection').classList.add('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('saas_jwt');
            localStorage.removeItem('saas_api_key');
            jwtToken = '';
            currentApiKey = '';
            updateApiKeyDisplay();
            checkAuthState();
        }

        async function generateApiKey() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/keys/generate`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${jwtToken}` }
                });
                const result = await res.json();
                if (res.ok) {
                    currentApiKey = result.apiKey || result.api_key || result.apiKeyData?.key_value || result.key;
                    localStorage.setItem('saas_api_key', currentApiKey);
                    updateApiKeyDisplay();
                    loadWeatherData();
                    alert('API Key berhasil di-generate dan otomatis aktif!');
                } else {
                    alert('Gagal generate key: ' + (result.error || 'Unauthorized'));
                }
            } catch (err) { 
                console.error(err);
                alert('Terjadi kesalahan koneksi.'); 
            }
        }

        function updateApiKeyDisplay() {
            const display = document.getElementById('apiKeyDisplay');
            const copyBtn = document.getElementById('copyBtn');
            if (currentApiKey) {
                display.innerText = currentApiKey;
                copyBtn.classList.remove('hidden');
            } else {
                display.innerText = 'Belum ada API Key. Silakan klik Generate.';
                copyBtn.classList.add('hidden');
            }
        }

        function copyApiKey() {
            navigator.clipboard.writeText(currentApiKey);
            alert('API Key berhasil disalin ke clipboard!');
        }

        async function loadWeatherData() {
            if (!currentApiKey) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/v1/weather`, {
                    headers: { 'x-api-key': currentApiKey }
                });
                const result = await res.json();
                const tbody = document.getElementById('weatherTableBody');
                tbody.innerHTML = '';
                if (!res.ok) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-rose-400">API Key tidak valid atau belum terdaftar.</td></tr>`;
                    return;
                }
                const items = Array.isArray(result) ? result : (result.data || []);
                if (items.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-500">Belum ada data cuaca.</td></tr>`;
                    return;
                }
                items.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-800/40 transition">
                            <td class="p-4 font-semibold text-white">${item.city}</td>
                            <td class="p-4 text-slate-300">${item.temperature}°C</td>
                            <td class="p-4 text-slate-300">${item.humidity}%</td>
                            <td class="p-4 text-slate-300">${item.wind_speed} km/h</td>
                            <td class="p-4 text-slate-300">${item.air_quality}</td>
                            <td class="p-4"><span class="px-2.5 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-lg text-xs font-bold">${item.status}</span></td>
                            <td class="p-4 text-center space-x-3">
                                <button onclick="editData('${item.id}', '${item.city}', ${item.temperature}, ${item.humidity}, ${item.wind_speed}, ${item.air_quality}, '${item.status}')" class="text-amber-400 hover:text-amber-300 text-xs font-bold">Edit</button>
                                <button onclick="deleteData('${item.id}')" class="text-rose-400 hover:text-rose-300 text-xs font-bold">Hapus</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        function openModal() {
            if (!currentApiKey) { alert('Silakan klik "Generate API Key Baru" terlebih dahulu!'); return; }
            document.getElementById('modalTitle').innerText = 'Tambah Data Cuaca';
            document.getElementById('weatherForm').reset();
            document.getElementById('dataId').value = '';
            document.getElementById('weatherModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('weatherModal').classList.add('hidden'); }

        function editData(id, city, temp, hum, wind, aqi, status) {
            document.getElementById('modalTitle').innerText = 'Edit Data Cuaca';
            document.getElementById('dataId').value = id;
            document.getElementById('city').value = city;
            document.getElementById('temperature').value = temp;
            document.getElementById('humidity').value = hum;
            document.getElementById('wind_speed').value = wind;
            document.getElementById('air_quality').value = aqi;
            document.getElementById('status').value = status;
            document.getElementById('weatherModal').classList.remove('hidden');
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('dataId').value;
            const payload = {
                city: document.getElementById('city').value,
                temperature: parseFloat(document.getElementById('temperature').value),
                humidity: parseInt(document.getElementById('humidity').value),
                wind_speed: parseFloat(document.getElementById('wind_speed').value),
                air_quality: parseInt(document.getElementById('air_quality').value),
                status: document.getElementById('status').value
            };
            
            const url = id ? `${API_BASE_URL}/api/v1/weather/${id}` : `${API_BASE_URL}/api/v1/weather`;
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'x-api-key': currentApiKey },
                    body: JSON.stringify(payload)
                });

                let result;
                try {
                    result = await res.json();
                } catch (e) {
                    result = { message: await res.text() };
                }

                if (res.ok) { 
                    closeModal(); 
                    loadWeatherData(); 
                } else { 
                    alert('Gagal menyimpan: ' + (result.message || result.error || JSON.stringify(result))); 
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan jaringan atau server mati.');
            }
        }

        async function deleteData(id) {
            if (!confirm('Yakin ingin hapus?')) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/v1/weather/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-api-key': currentApiKey }
                });
                if (res.ok) { 
                    loadWeatherData(); 
                } else {
                    const result = await res.json().catch(() => ({}));
                    alert('Gagal menghapus: ' + (result.message || result.error || 'Terjadi kesalahan'));
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan jaringan saat menghapus.');
            }
        }
    </script>
</body>
</html>
